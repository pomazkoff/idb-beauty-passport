<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FDFCFB">
<title>Опросник ЛК · ИЛЬ ДЕ БОТЭ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#E30138; --brand-deep:#B00029; --brand-tint:#FDEBEF;
  --ink:#171214; --ink-2:#4A4145; --ink-3:#8A7F84;
  --milk:#FDFCFB; --milk-2:#F7F4F2; --line:#E9E2DF;
  --gold:#A8863C; --gold-tint:#F8F2E6;
}
html{color-scheme:only light;background:var(--milk)}
@media (prefers-color-scheme:dark){html,body{background:#FDFCFB!important;color:#171214!important}}
body{font-family:'Manrope',sans-serif;background:var(--milk);color:var(--ink);line-height:1.6;font-size:15px}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 60px}

header{border-bottom:1px solid var(--line);padding:16px 0;margin-bottom:8px;
  position:sticky;top:0;background:rgba(253,252,251,.96);backdrop-filter:blur(10px);z-index:20}
.hdr{display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:0 auto;padding:0 20px}
.logo{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;letter-spacing:.14em}
.logo b{color:var(--brand);font-weight:600}
.hdr-tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

.progress{height:2px;background:var(--line);margin-top:12px;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--brand);width:0;transition:width .35s ease;border-radius:2px}
.stepmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:8px;
  letter-spacing:.04em}

.screen{padding-top:28px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand);
  font-weight:600;margin-bottom:10px}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,6vw,44px);font-weight:500;
  line-height:1.08;margin-bottom:14px}
h1 em{font-style:italic;color:var(--brand)}
.lead{font-size:15px;color:var(--ink-2);font-weight:300;margin-bottom:26px}

.qtext{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;
  line-height:1.25;margin-bottom:6px}
.qhint{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
.draft{display:inline-block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--gold-tint);color:var(--gold);padding:2px 8px;border-radius:10px;
  font-weight:600;margin-bottom:10px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;
  text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover{border-color:var(--brand);background:var(--brand-tint)}
.opt:active{transform:scale(.995)}
.opt.on{border-color:var(--brand);background:var(--brand-tint)}
.mark{flex:0 0 18px;height:18px;margin-top:2px;border:1.5px solid var(--ink-3);
  border-radius:50%;position:relative;transition:border-color .15s}
.multi .mark{border-radius:5px}
.opt.on .mark{border-color:var(--brand);background:var(--brand)}
.opt.on .mark::after{content:'';position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-size:11px;font-weight:700}
.opt.on .mark::after{content:'✓';line-height:15px;text-align:center}
.olabel{flex:1}
.otitle{font-size:14.5px;font-weight:500;line-height:1.4}
.osub{font-size:12px;color:var(--ink-3);margin-top:2px}

.nav{display:flex;gap:10px;margin-top:24px;align-items:center}
.btn{border:none;border-radius:10px;padding:13px 26px;font:inherit;font-weight:600;
  font-size:14px;cursor:pointer;transition:background .15s,opacity .15s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-primary:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn-ghost{background:none;color:var(--ink-3);padding:13px 6px}
.btn-ghost:hover{color:var(--ink)}
.skip{margin-left:auto;font-size:12.5px;color:var(--ink-3);background:none;border:none;
  cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:3px}
.skip:hover{color:var(--brand)}

/* ── RESULT ── */
.rcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
.rtype{background:linear-gradient(135deg,#fff,var(--brand-tint));border-color:var(--brand)}
.rtype-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--brand);
  line-height:1.1;margin:4px 0 8px}
.rtype-desc{font-size:14px;color:var(--ink-2);font-weight:300}
.rlabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.prof{display:flex;flex-direction:column;gap:0}
.prow{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:13.5px;align-items:start}
.prow:last-child{border-bottom:none}
.pk{color:var(--ink-3);font-size:12px;line-height:1.5}
.pv{font-weight:500;line-height:1.5}

.wgrid{display:flex;flex-direction:column;gap:9px}
.w{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:14px 16px}
.w.prio{border-color:var(--gold);background:linear-gradient(135deg,#fff,var(--gold-tint))}
.wnum{flex:0 0 26px;height:26px;border-radius:50%;background:var(--milk-2);color:var(--ink-3);
  display:grid;place-items:center;font-size:12px;font-weight:600}
.w.prio .wnum{background:var(--gold);color:#fff}
.wname{font-size:14.5px;font-weight:600;line-height:1.35}
.wwhy{font-size:12.5px;color:var(--ink-2);font-weight:300;margin-top:3px;line-height:1.5}
.sect{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:26px 0 12px}

.note{background:var(--milk-2);border-radius:12px;padding:16px 18px;font-size:12.5px;
  color:var(--ink-2);font-weight:300;line-height:1.6;margin-top:18px}
.note b{font-weight:600;color:var(--ink)}

/* ── Индикатор заполненности ── */
.meter{background:var(--gold-tint);border:1px solid #E8DCC4;border-radius:14px;
  padding:16px 18px;margin-bottom:16px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.meter-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);font-weight:600}
.meter-val{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);font-weight:600}
.meter-bar{height:4px;background:#E8DCC4;border-radius:3px;overflow:hidden}
.meter-fill{height:100%;background:linear-gradient(90deg,var(--gold),#C9A96E);
  border-radius:3px;transition:width .5s ease}
.meter-next{font-size:12px;color:var(--ink-2);margin-top:9px;font-weight:300}

/* ── Анонс Паспорта ── */
.announce{background:linear-gradient(135deg,#fff,var(--brand-tint));
  border:1px solid var(--brand);border-radius:16px;padding:24px;margin:26px 0 18px}
.ann-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brand);font-weight:600;margin-bottom:8px}
.ann-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;
  line-height:1.15;margin-bottom:10px}
.ann-text{font-size:14px;color:var(--ink-2);font-weight:300;line-height:1.65}
.ann-bullets{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.ann-b{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink)}
.ann-dot{flex:0 0 6px;height:6px;border-radius:50%;background:var(--brand);margin-top:8px}
.ann-foot{font-size:11.5px;color:var(--ink-3);margin-top:10px}
@media(max-width:520px){.prow{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>

<header><div class="hdr">
  <span class="logo">ИЛЬ <b>ДЕ</b> БОТЭ</span>
  <span class="hdr-tag">Опросник ЛК</span>
</div></header>

<div class="wrap">
  <div id="bar" style="display:none">
    <div class="progress"><div class="progress-fill" id="pf"></div></div>
    <div class="stepmeta"><span id="stepName"></span><span id="stepNum"></span></div>
  </div>
  <div id="app"></div>
</div>

<script>

// ═══════════════════════════════════════════════════════════
const S = {phase:'intro', step:0, answers:{}, queue:[], multiSel:new Set(),
           doneCats:[], activeCat:null};
const app = document.getElementById('app');
const bar = document.getElementById('bar');

const BASE = [T.q1,T.q2,T.q3,T.q4,T.q5];

function G(){ const i=S.answers.gender; return i===undefined?null:T.q1.opts[i].v; }
function CAT(){ const i=S.answers.category; if(i===undefined) return null;
  const o=optsFor(T.q5); return o[i]?o[i].v:null; }
function optsFor(q){
  if(q.byGender){ const g = S.answers.gender===undefined ? 'ж' : T.q1.opts[S.answers.gender].v;
    return q.byGender[g] || q.byGender['ж']; }
  return q.opts;
}
function catName(v){ const o=optsFor(T.q5).find(x=>x.v===v); return o?o.t:v; }

function buildQueue(){
  if(S.phase==='base'){ S.queue = BASE; return; }
  if(S.phase==='passport'){
    const key = G()+'_'+S.activeCat, blk = L2[key];
    S.queue = blk ? blk.qs.map((qq,i)=>({...qq, key:key+'_'+i,
      block:'Паспорт · '+blk.name, draft:blk.draft})) : [];
  }
}

function completeness(){
  let pct = S.phase==='intro' ? 0 : 40;
  pct += Math.min(S.doneCats.length,3)*20;
  return Math.min(pct,100);
}

// ── Рендер вопроса ────────────────────────────────────────
function renderQuestion(){
  const q = S.queue[S.step];
  const opts = optsFor(q);
  const isMulti = q.type === 'multi';
  bar.style.display='block';
  document.getElementById('pf').style.width = ((S.step)/S.queue.length*100)+'%';
  document.getElementById('stepName').textContent = q.block || '';
  document.getElementById('stepNum').textContent = (S.step+1)+' / '+S.queue.length;

  const saved = S.answers[q.key];
  S.multiSel = new Set(isMulti && Array.isArray(saved) ? saved : []);

  app.innerHTML = `
   <div class="screen">
     ${q.draft?'<div class="draft">вопрос дописан</div>':''}
     <div class="qtext">${q.text}</div>
     <div class="qhint">${isMulti?'Можно выбрать несколько вариантов':'Выберите один вариант'}</div>
     <div class="opts ${isMulti?'multi':''}">
       ${opts.map((o,i)=>`
         <button class="opt ${isMulti && S.multiSel.has(i) ? 'on':''} ${!isMulti && saved===i?'on':''}" data-i="${i}">
           <span class="mark"></span>
           <span class="olabel"><span class="otitle">${o.t}</span>
           ${o.s?`<span class="osub">${o.s}</span>`:''}</span>
         </button>`).join('')}
     </div>
     <div class="nav">
       ${S.step>0?'<button class="btn btn-ghost" id="back">Назад</button>':''}
       ${isMulti?`<button class="btn btn-primary" id="next" ${S.multiSel.size?'':'disabled'}>Далее</button>`:''}
       ${isMulti?'':'<span style="font-size:12.5px;color:var(--ink-3)">Нажмите на вариант, чтобы продолжить</span>'}
       ${isMulti?'<button class="skip" id="skip">Пропустить</button>':''}
     </div>
   </div>`;

  document.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.i;
      if(isMulti){
        S.multiSel.has(i) ? S.multiSel.delete(i) : S.multiSel.add(i);
        b.classList.toggle('on');
        document.getElementById('next').disabled = !S.multiSel.size;
      } else {
        const changed = S.answers[q.key] !== i;
        S.answers[q.key] = i;
        if(changed && q.key==='gender'){
          Object.keys(S.answers).forEach(k=>{ if(k.includes('_')) delete S.answers[k]; });
          delete S.answers.category; S.doneCats=[];
        }
        advance();
      }
    };
  });
  const nx=document.getElementById('next');
  if(nx) nx.onclick=()=>{ S.answers[q.key]=[...S.multiSel]; advance(); };
  const sk=document.getElementById('skip');
  if(sk) sk.onclick=()=>{ S.answers[q.key]=[]; advance(); };
  const bk=document.getElementById('back');
  if(bk) bk.onclick=()=>{ S.step--; render(); up(); };
}

function advance(){
  S.step++;
  if(S.step >= S.queue.length){
    if(S.phase==='base'){ S.phase='result1'; }
    else if(S.phase==='passport'){
      if(!S.doneCats.includes(S.activeCat)) S.doneCats.push(S.activeCat);
      S.phase='result2';
    }
  }
  render(); up();
}
function up(){ window.scrollTo({top:0,behavior:'smooth'}); }

// ── Психотип ──────────────────────────────────────────────
function psychotype(){
  const votes=[S.answers.psycho1,S.answers.psycho2,S.answers.psycho3]
    .map((i,n)=>{ if(i===undefined) return null;
      return optsFor([T.q2,T.q3,T.q4][n])[i].v; }).filter(Boolean);
  const c={E:0,P:0,L:0,M:0}; votes.forEach(v=>c[v]++);
  if(c.M>=2) return 'M';
  const max=Math.max(c.E,c.P,c.L);
  const lead=['E','P','L'].filter(k=>c[k]===max);
  if(max===0||lead.length>1) return 'M';
  return lead[0];
}

// ── Блоки результата ──────────────────────────────────────
function widgetHTML(t){
  const prio=W.filter(w=>w.seg!=='all'&&(t==='M'?true:w.seg.includes(t)));
  const base=W.filter(w=>w.seg==='all');
  return `
   <div class="sect">Ваши виджеты · подобраны по типу</div>
   <div class="wgrid">
     ${prio.map(w=>`<div class="w prio"><div class="wnum">${w.n}</div>
       <div><div class="wname">${w.name}</div><div class="wwhy">${w.why}</div></div></div>`).join('')}
   </div>
   <div class="sect">Базовые виджеты · для всех</div>
   <div class="wgrid">
     ${base.map(w=>`<div class="w"><div class="wnum">${w.n}</div>
       <div><div class="wname">${w.name}</div><div class="wwhy">${w.why}</div></div></div>`).join('')}
   </div>`;
}

function meterHTML(){
  const pct=completeness();
  return `
   <div class="meter">
     <div class="meter-row">
       <span class="meter-label">Профиль заполнен</span>
       <span class="meter-val">${pct}%</span>
     </div>
     <div class="meter-bar"><div class="meter-fill" style="width:${pct}%"></div></div>
     ${pct<100?`<div class="meter-next">${pct===40
        ? 'Соберите Паспорт красоты — рекомендации станут точнее'
        : 'Добавьте ещё категорию, чтобы профиль стал полным'}</div>`:
        '<div class="meter-next">Профиль полный — рекомендации максимально точные</div>'}
   </div>`;
}

function profileRows(catV){
  const key=G()+'_'+catV, blk=L2[key]; if(!blk) return '';
  const rows=[];
  blk.qs.forEach((qq,i)=>{
    const a=S.answers[key+'_'+i];
    if(a===undefined||(Array.isArray(a)&&!a.length)) return;
    const vals=Array.isArray(a)?a.map(x=>qq.opts[x]):[qq.opts[a]];
    rows.push([qq.k, vals.map(o=>o.s?`${o.t} (${o.s})`:o.t).join(' · ')]);
  });
  if(!rows.length) return '';
  return `<div class="sect">Паспорт · ${blk.name}</div>
   <div class="rcard prof">
     ${rows.map(r=>`<div class="prow"><div class="pk">${r[0]}</div><div class="pv">${r[1]}</div></div>`).join('')}
   </div>`;
}

function renderResult2(){
  bar.style.display='none';
  const t=psychotype();
  const rest=optsFor(T.q5).filter(o=>!S.doneCats.includes(o.v));
  app.innerHTML=`
   <div class="screen">
     <div class="eyebrow">Паспорт обновлён</div>
     <h1>Рекомендации <em>уточнены</em></h1>
     <p class="lead">Теперь мы подбираем не отдельные товары, а систему ухода под Ваш профиль.</p>

       <div class="rtype-desc">${TYPES[t].desc}</div>
     </div>

     ${S.doneCats.map(c=>profileRows(c)).join('')}

     ${widgetHTML(t)}

     ${rest.length?`
     <div class="announce">
       <div class="ann-eyebrow">Расширить паспорт</div>

  document.querySelectorAll('[data-c]').forEach(b=>{

  });
  document.getElementById('again').onclick=()=>{
    S.answers={}; S.doneCats=[]; S.phase='intro'; S.step=0; render(); up(); };
}

function render(){
  if(S.phase==='intro')   return renderIntro();
  if(S.phase==='result1') return renderResult1();
  if(S.phase==='result2') return renderResult2();
  buildQueue();
  if(S.step>=S.queue.length){ advance(); return; }
  renderQuestion();
}

render();
</script>
