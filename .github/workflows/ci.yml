name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: idb, POSTGRES_PASSWORD: idb, POSTGRES_DB: beauty_passport }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://idb:idb@localhost:5432/beauty_passport
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @idb/db db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @idb/api build && pnpm --filter @idb/worker build && pnpm --filter @idb/web build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: idb, POSTGRES_PASSWORD: idb, POSTGRES_DB: beauty_passport }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://idb:idb@localhost:5432/beauty_passport
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @idb/db db:migrate
      - run: pnpm --filter @idb/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }
