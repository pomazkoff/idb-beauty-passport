<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Демо встраивания · idb-beauty-quiz</title>
<style>body{font-family:Georgia,serif;background:#eee;margin:0;padding:24px} .lk{max-width:900px;margin:0 auto;background:#fff;border-radius:16px;padding:24px} h2{margin-top:0} pre{background:#f6f6f6;padding:12px;border-radius:8px;font-size:12px;max-height:200px;overflow:auto}</style>
</head>
<body>
<div class="lk">
  <h2>Личный кабинет (хост-страница)</h2>
  <p>Ниже — виджет опросника как web-компонент. События наружу пишутся в лог.</p>
  <idb-beauty-quiz api-base="http://localhost:3000" customer-id="embed-demo"></idb-beauty-quiz>
  <h3>События</h3>
  <pre id="log"></pre>
</div>
<script type="module" src="/embed/idb-beauty-quiz.js"></script>
<script>
  const log = document.getElementById('log');
  for (const n of ['quiz:base-completed','quiz:category-completed','quiz:closed','quiz:analytics']) {
    document.addEventListener(n, (e) => { log.textContent = `${n} ${JSON.stringify(e.detail ?? null).slice(0,200)}\n` + log.textContent; });
  }
</script>
</body>
</html>
